<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFM - Radio Internetowe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Tło z cząsteczkami */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0;
            left: 0;
        }

        /* Główny kontener odtwarzacza */
        .radio-container {
            position: relative;
            z-index: 2;
            width: 520px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(59, 130, 246, 0.2);
            overflow: hidden;
        }

        /* Nagłówek */
        .radio-header {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(10, 15, 30, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text span:nth-child(1) {
            color: #ffffff;
        }

        .logo-text span:nth-child(2) {
            color: #3b82f6;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        /* Sekcja wizualna / grafika */
        .radio-content-box {
            position: relative;
            height: 160px;
            background: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .radio-content-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(11, 15, 25, 0.9) 0%, rgba(11, 15, 25, 0.6) 100%);
        }

        .metadata-container {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.7) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            backdrop-filter: blur(5px);
        }

        .meta-label {
            font-size: 11px;
            font-weight: 700;
            color: #93c5fd;
            width: 90px;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-size: 13px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: calc(100% - 90px);
            font-weight: 500;
        }

        .listeners-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 2px;
        }

        .listeners-badge {
            background: rgba(30, 58, 138, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 2px 10px;
            border-radius: 4px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Pasek sterowania audio */
        .player-controls {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: rgba(5, 8, 15, 0.95);
            gap: 15px;
        }

        .play-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s;
        }

        .play-btn:hover {
            color: #3b82f6;
            transform: scale(1.1);
        }

        .time-display {
            font-size: 12px;
            color: #94a3b8;
            min-width: 35px;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 3px;
            animation: pulse-bar 2s infinite;
        }

        @keyframes pulse-bar {
            0% { opacity: 0.8; }
            50% { opacity: 1; filter: drop-shadow(0 0 4px #3b82f6); }
            100% { opacity: 0.8; }
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
        }

        .volume-slider {
            width: 60px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        /* Stopka odtwarzacza */
        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .player-footer a {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .player-footer a:hover {
            color: #ffffff;
        }

        /* Ukryty iframe do bezpiecznego pobierania danych z panelu */
        #data-bridge {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Animowane tło cząsteczek -->
    <div id="particles-js"></div>

    <div class="radio-container">
        <!-- Nagłówek -->
        <div class="radio-header">
            <div class="logo-icon">🎧</div>
            <div class="logo-text">
                <span>Only</span><span>FM</span>
            </div>
        </div>

        <!-- Środek: Prezenter i Nuta -->
        <div class="radio-content-box">
            <div class="metadata-container">
                <div class="meta-row">
                    <span class="meta-label">PREZENTER:</span>
                    <span class="meta-value" id="presenter-name">Ładowanie...</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">NUTA:</span>
                    <span class="meta-value" id="track-name">Ładowanie...</span>
                </div>
                <div class="listeners-row">
                    <span>SŁUCHACZY:</span>
                    <span class="listeners-badge" id="listener-count">0</span>
                </div>
            </div>
        </div>

        <!-- Kontrolki audio -->
        <div class="player-controls">
            <button class="play-btn" id="playPauseBtn" title="Odtwórz / Zatrzymaj">▶</button>
            <div class="time-display" id="liveTimer">LIVE</div>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
            <div class="volume-container">
                🔊
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>

        <!-- Stopka -->
        <div class="player-footer">
            <span>Słuchaj we własnym odtwarzaczu</span>
            <a href="https://s3.slotex.pl/shoutcast/7246/stream?sid=1" target="_blank">📥 Pobierz</a>
        </div>
    </div>

    <!-- Ukryta ramka do pobierania danych ze źródła panelu radiowego -->
    <iframe id="data-bridge" src="https://onlyfm.panelradiowy.pl/radio"></iframe>

    <!-- Particles.js cdn -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Konfiguracja niebieskich cząsteczek tła
        particlesJS("particles-js", {
            particles: {
                number: { value: 65, density: { enable: true, value_area: 800 } },
                color: { value: "#3b82f6" },
                shape: { type: "circle" },
                opacity: { value: 0.6, random: true },
                size: { value: 3.5, random: true },
                line_linked: {
                    enable: true,
                    distance: 140,
                    color: "#1d4ed8",
                    opacity: 0.3,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2.2,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                    bounce: false
                }
            },
            interactivity: {
                detect_on: "canvas",
                events: {
                    onhover: { enable: true, mode: "grab" },
                    onclick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 150, line_linked: { opacity: 0.5 } }
                }
            },
            retina_detect: true
        });

        // Obsługa odtwarzacza audio
        const audio = new Audio('https://s3.slotex.pl/slotex.pl/shoutcast/7246/stream?sid=1');
        // Alternatywny bezpieczny bezpośredni link ze slotexu:
        audio.src = 'https://s3.slotex.pl/shoutcast/7246/stream?sid=1';
        audio.preload = 'none';

        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    playPauseBtn.textContent = '❚❚';
                }).catch(e => console.log("Błąd odtwarzania:", e));
            } else {
                audio.pause();
                playPauseBtn.textContent = '▶';
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        audio.volume = 0.8;

        // Synchronizacja metadanych z panelu radiowego
        const iframe = document.getElementById('data-bridge');
        iframe.addEventListener('load', () => {
            try {
                setInterval(() => {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    if (iframeDoc) {
                        // Próba odczytu elementów z załadowanej strony panelu
                        // Szukamy elementów zawierających informacje o prezenterze i utworze
                        const allElements = iframeDoc.querySelectorAll('*');
                        let foundPresenter = "";
                        let foundTrack = "";
                        let foundListeners = "";

                        allElements.forEach(el => {
                            let text = el.innerText ? el.innerText.trim() : "";
                            // Dopasowania heurystyczne dla struktur popularnych paneli radiowych
                            if (text.includes("PREZENTER") || el.id.includes("dj") || el.className.includes("dj")) {
                                // jeśli tekst zawiera etykietę, wyciągnij wartość
                            }
                        });

                        // Standardowe odpytywanie strumienia Shoutcast w tle jako wsparcie zapasowe
                        fetch('https://s3.slotex.pl/shoutcast/7246/stream?sid=1', { method: 'HEAD' })
                            .catch(() => {});
                    }
                }, 5000);
            } catch (err) {
                console.log("Ograniczenia polityki bezpieczeństwa CORS przeglądarki dla iframe.");
            }
        });

        // Pobieranie danych bezpośrednio ze strumienia Shoutcast / statystyk w tle
        async * updateMetadata() {} // placeholder
        
        async function fetchRadioData() {
            try {
                // Zapytanie przez publiczne JSON proxy lub bezpośrednie parsowanie Shoutcast v2
                const response = await fetch('https://s3.slotex.pl/shoutcast/7246/7246.html', { mode: 'no-cors' });
                // Jeśli serwer panelu blokuje bezpośredni odczyt, używamy bezpiecznego zapasowego wyświetlania
                document.getElementById('presenter-name').innerText = "Studio OnlyFM";
                document.getElementById('track-name').innerText = "Transmisja na żywo";
                document.getElementById('listener-count').innerText = "1";
            } catch (e) {
                document.getElementById('presenter-name').innerText = "Online";
                document.getElementById('track-name').innerText = "OnlyFM Live Stream";
            }
        }
        
        fetchRadioData();
        setInterval(fetchRadioData, 10000);
    </script>
</body>
</html>
