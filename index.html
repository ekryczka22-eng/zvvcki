<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Stereo - Konwerter MP3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #05080c; color: #d2dcf0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        .top-buttons { position: absolute; top: 25px; right: 25px; z-index: 10; display: flex; gap: 10px; }
        .top-btn { padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #ffffff; transition: all 0.3s ease; }
        .discord-btn { background-color: #5865F2; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); }
        .discord-btn:hover { background-color: #4752c4; transform: translateY(-2px); }
        .mta-btn { background-color: #e67e22; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); }
        .mta-btn:hover { background-color: #d35400; transform: translateY(-2px); }

        .container { position: relative; z-index: 2; background: linear-gradient(145deg, rgba(13, 19, 30, 0.95), rgba(8, 12, 18, 0.98)); border: 1px solid rgba(52, 152, 219, 0.2); padding: 45px; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); text-align: center; }
        h1 { font-size: 30px; font-weight: 800; margin-bottom: 8px; color: #ffffff; }
        h1 span { color: #3498db; }
        p { color: #7c8db0; font-size: 13px; margin-bottom: 30px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #9ab0d4; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 14px 16px; background-color: #0b111a; border: 1px solid #1c283d; border-radius: 8px; color: #ffffff; font-size: 14px; outline: none; }
        input:focus { border-color: #3498db; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #3498db, #2980b9); border: none; border-radius: 8px; color: #ffffff; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3); }
        button:hover { background: linear-gradient(135deg, #38a1db, #2472a4); }
        .result-box { margin-top: 25px; display: none; text-align: left; }
        .result-wrapper { display: flex; gap: 8px; }
        .result-box input { color: #3498db; font-weight: bold; text-align: center; }
        .copy-btn { width: auto; padding: 0 18px; background: #27ae60; }
        .loader { display: none; margin: 20px auto; border: 3px solid rgba(52, 152, 219, 0.1); border-top: 3px solid #3498db; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-msg { font-size: 12px; color: #3498db; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="top-buttons">
        <a href="mtasa://51.83.182.33:20540" class="top-btn mta-btn" title="Połącz z serwerem MTA">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            MTA Server
        </a>
        <a href="https://discord.gg/onlyproject" target="_blank" class="top-btn discord-btn" title="Dołącz do Discorda">
            <svg width="16" height="13" fill="currentColor" viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.63-27.29-4.53-51.19-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.18,46,96.15,53,91,65.69,84.69,65.69Z"/></svg>
            Discord
        </a>
    </div>

    <canvas id="particles-canvas"></canvas>

    <div class="container">
        <h1>ONLY <span>STEREO</span></h1>
        <p>Wklej link z SoundCloud lub YouTube, aby wygenerować link MP3 do gry.</p>
        <div class="input-group">
            <label>LINK DO UTWORU:</label>
            <input type="text" id="urlInput" placeholder="https://soundcloud.com/... lub YouTube">
        </div>
        <button id="convertBtn" onclick="convertAudio()">Konwertuj utwór</button>
        <div class="loader" id="loader"></div>
        <div class="status-msg" id="statusMsg">Przetwarzanie pliku audio...</div>
        <div class="result-box" id="resultSection">
            <label>BEZPOŚREDNI LINK MP3 (WKLEJ DO GRY):</label>
            <div class="result-wrapper">
                <input type="text" id="outputLink" readonly onclick="this.select();">
                <button class="copy-btn" onclick="copyLink()">Kopiuj</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        const particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({ x: (Math.random() - 0.5) * window.innerWidth, y: (Math.random() - 0.5) * window.innerHeight, size: Math.random() * 2.5 + 0.8, speed: Math.random() * 0.6 + 0.2, alpha: Math.random() * 0.6 + 0.1 });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2, centerY = canvas.height / 2;
            particles.forEach(p => {
                p.y -= p.speed; if (p.y < -canvas.height/2) p.y = canvas.height/2;
                ctx.beginPath(); ctx.arc(centerX + p.x, centerY + p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(52, 152, 219, ${p.alpha})`; ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function convertAudio() {
            const url = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader'), statusMsg = document.getElementById('statusMsg');
            const resultSection = document.getElementById('resultSection'), outputLink = document.getElementById('outputLink'), btn = document.getElementById('convertBtn');
            
            if (!url) { alert("Najpierw wklej link do utworu!"); return; }
            
            loader.style.display = "block"; statusMsg.style.display = "block"; resultSection.style.display = "none"; btn.disabled = true;
            
            try {
                // Użycie publicznego stabilnego API Cobalt do konwersji linków audio
                const response = await fetch('https://co.wuk.sh/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        downloadMode: 'audio',
                        audioFormat: 'mp3'
                    })
                });
                
                const data = await response.json();
                
                if (data && (data.url || data.picker)) {
                    outputLink.value = data.url || data.picker[0].url;
                    resultSection.style.display = "block";
                } else {
                    throw new Error(data.text || "Nie udało się wygenerować linku.");
                }
            } catch (err) {
                alert("Wystąpił błąd podczas konwersji: " + (err.message || "Sprawdź poprawność linku."));
            } finally {
                loader.style.display = "none"; statusMsg.style.display = "none"; btn.disabled = false;
            }
        }

        function copyLink() {
            const outputLink = document.getElementById('outputLink');
            outputLink.select(); document.execCommand('copy');
            alert("Link skopiowany do schowka! Możesz go wkleić pod F6 w grze.");
        }
    </script>
</body>
</html>
