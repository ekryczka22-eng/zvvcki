<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Stereo - Konwerter MP3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05080c;
            color: #d2dcf0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Kontener na przyciski w prawym górnym rogu */
        .top-buttons {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .top-btn {
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .discord-btn {
            background-color: #5865F2;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
        }

        .mta-btn {
            background-color: #e67e22;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }

        .mta-btn:hover {
            background-color: #d35400;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 126, 34, 0.6);
        }

        .container {
            position: relative;
            z-index: 2;
            background: linear-gradient(145deg, rgba(13, 19, 30, 0.95), rgba(8, 12, 18, 0.98));
            border: 1px solid rgba(52, 152, 219, 0.2);
            padding: 45px;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(52, 152, 219, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(52, 152, 219, 0.4);
        }

        h1 span {
            color: #3498db;
        }

        p {
            color: #7c8db0;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #9ab0d4;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #0b111a;
            border: 1px solid #1c283d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #3498db;
            box-shadow: 0 0 12px rgba(52, 152, 219, 0.25);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            margin-top: 5px;
        }

        button:hover {
            background: linear-gradient(135deg, #38a1db, #2472a4);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.5);
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 25px;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-wrapper {
            display: flex;
            gap: 8px;
        }

        .result-box input {
            background-color: #0b111a;
            color: #3498db;
            font-weight: bold;
            text-align: center;
        }

        .copy-btn {
            width: auto;
            padding: 0 18px;
            margin: 0;
            background: #27ae60;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

        .copy-btn:hover {
            background: #219653;
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 3px solid rgba(52, 152, 219, 0.1);
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 12px;
            color: #3498db;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Przyciski nawigacyjne w prawym górnym rogu -->
    <div class="top-buttons">
        <a href="mtasa://51.83.182.33:20540" class="top-btn mta-btn" title="Połącz z serwerem MTA">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            MTA Server
        </a>
        <a href="https://discord.gg/onlyproject" target="_blank" class="top-btn discord-btn" title="Dołącz do Discorda">
            <svg width="16" height="13" fill="currentColor" viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.15c2.63-27.29-4.53-51.19-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.44-12.72S96.18,46,96.15,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Discord
        </a>
    </div>

    <canvas id="particles-canvas"></canvas>

    <div class="container">
        <h1>ONLY <span>STEREO</span></h1>
        <p>Wklej link z YouTube, aby wygenerować link MP3 do gry.</p>
        
        <div class="input-group">
            <label>LINK DO UTWORU (YOUTUBE):</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        
        <button id="convertBtn" onclick="convertAudio()">Konwertuj utwór</button>
        <div class="loader" id="loader"></div>
        <div class="status-msg" id="statusMsg">Pobieranie i konwertowanie pliku audio...</div>

        <div class="result-box" id="resultSection">
            <label>BEZPOŚREDNI LINK MP3 (WKLEJ DO GRY):</label>
            <div class="result-wrapper">
                <input type="text" id="outputLink" readonly onclick="this.select();">
                <button class="copy-btn" onclick="copyLink()">Kopiuj</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({
                x: (Math.random() - 0.5) * window.innerWidth,
                y: (Math.random() - 0.5) * window.innerHeight,
                size: Math.random() * 2.5 + 0.8,
                speed: Math.random() * 0.6 + 0.2,
                alpha: Math.random() * 0.6 + 0.1
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < -canvas.height/2) p.y = canvas.height/2;

                ctx.beginPath();
                ctx.arc(centerX + p.x, centerY + p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(52, 152, 219, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        async function convertAudio() {
            const url = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const statusMsg = document.getElementById('statusMsg');
            const resultSection = document.getElementById('resultSection');
            const outputLink = document.getElementById('outputLink');
            const btn = document.getElementById('convertBtn');

            if (!url) {
                alert("Najpierw wklej link do utworu z YouTube!");
                return;
            }

            loader.style.display = "block";
            statusMsg.style.display = "block";
            resultSection.style.display = "none";
            btn.disabled = true;

            try {
                const response = await fetch(`https://co.wuk.sh/api/json`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        isAudioOnly: true,
                        dubLang: false
                    })
                });

                const data = await response.json();

                if (data && (data.url || data.audio)) {
                    outputLink.value = data.url || data.audio;
                    resultSection.style.display = "block";
                } else {
                    throw new Error("Błędna odpowiedź serwera konwertującego");
                }
            } catch (err) {
                alert("Nie udało się skonwertować tego linku. Upewnij się, że podajesz poprawny adres URL z YouTube.");
            } finally {
                loader.style.display = "none";
                statusMsg.style.display = "none";
                btn.disabled = false;
            }
        }

        function copyLink() {
            const outputLink = document.getElementById('outputLink');
            outputLink.select();
            document.execCommand('copy');
            alert("Link skopiowany do schowka! Możesz go wkleić pod F6 w grze.");
        }
    </script>
</body>
</html>
