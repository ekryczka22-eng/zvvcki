<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyFM - Twoje Ulubione Radio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07090e;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Custom canvas background particles */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;class="text-blue-400 hover:underline font-medium inline-flex items-center gap-1 ml-1">
                            <i class="fa-solid fa-download"></i> Pobierz .pls
                        </a>
                    </span>
                    <button onclick="shareRadio()" class="hover:text-blue-400 transition inline-flex items-center gap-1.5 bg-blue-950/40 px-3 py-1.5 rounded-lg border border-blue-500/20 text-blue-300 font-medium">
                        <i class="fa-solid fa-share-nodes"></i> Udostępnij
                    </button>
                </div>
            </div>
        }
        .glass-panel {
            background: rgba(13, 17, 28, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(37, 99, 235, 0.1);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .custom-slider::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-blue-500 selection:text-white">

    <canvas id="particles-canvas"></canvas>

    <!-- Main Header -->
    <header class="relative z-10 w-full py-6 px-6 md:px-12 flex justify-between items-center border-b border-blue-900/30 bg-black/30 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-blue-400 text-xl shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <i class="fa-solid fa-headphones"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                <span class="text-white">Only</span><span class="text-blue-500 glow-text">FM</span>
            </h1>
        </div>
        <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-300">
            <a href="#player" class="hover:text-blue-400 transition">Odtwarzacz</a>
            <a href="#schedule" class="hover:text-blue-400 transition">Ramówka</a>
            <a href="#contact" class="hover:text-blue-400 transition">Kontakt</a>
        </nav>
    </header>

    <main id="player" class="relative z-10 flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-xl glass-panel rounded-2xl overflow-hidden p-6 md:p-8">
            
            <!-- Top Tabs / Header Inside Player -->
            <div class="flex border-b border-blue-500/20 pb-4 mb-6 justify-between items-center text-sm font-semibold">
                <div class="flex space-x-4">
                    <button class="text-blue-400 border-b-2 border-blue-500 pb-1 px-1 transition">Player</button>
                    <button onclick="openModal('Ramówka w przygotowaniu')" class="text-gray-400 hover:text-white transition">Ramówka</button>
                    <button onclick="openModal('Wyślij pozdrowienia na naszym czacie!')" class="text-gray-400 hover:text-white transition">Pozdrowienia</button>
                </div>
                <div class="flex items-center space-x-2 text-xs text-blue-400 bg-blue-500/10 px-3 py-1.5 rounded-full border border-blue-500/20">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                    <span>NA ŻYWO</span>
                </div>
            </div>

            <!-- Metadata Display Screen (Host & Song) -->
            <div class="relative bg-black/60 rounded-xl p-5 mb-6 border border-blue-500/30 overflow-hidden shadow-inner">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-600/10 to-transparent pointer-events-none"></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                    <!-- Host Info -->
                    <div class="flex flex-col justify-center border-b md:border-b-0 md:border-r border-blue-900/40 pb-3 md:pb-0 md:pr-4">
                        <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-user-tie"></i> Prezenter:
                        </span>
                        <span id="presenter-name" class="text-base font-bold text-gray-100 truncate">Ładowanie...</span>
                    </div>
                    <!-- Song Info -->
                    <div class="flex flex-col justify-center">
                        <span class="text-xs font-semibold text-blue-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-music"></i> Nuta:
                        </span>
                        <span id="song-title" class="text-base font-bold text-gray-100 truncate">Ładowanie...</span>
                    </div>
                </div>
            </div>

            <!-- Audio Controller & VU / Visualizer Bar -->
            <div class="flex flex-col space-y-6">
                <div class="flex items-center justify-between bg-black/40 p-4 rounded-xl border border-blue-500/20">
                    <!-- Play / Pause Button -->
                    <button id="play-btn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center text-xl shadow-[0_0_20px_rgba(59,130,246,0.5)] transition transform hover:scale-105 active:scale-95 focus:outline-none">
                        <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
                    </button>
                    
                    <!-- Equalizer Animation bars -->
                    <div id="equalizer" class="flex items-end space-x-1 h-8 opacity-40 transition-opacity duration-300">
                        <div class="w-1.5 bg-blue-500 rounded-full h-3 animate-pulse" style="animation-duration: 0.8s"></div>
                        <div class="w-1.5 bg-blue-500 rounded-full h-6 animate-pulse" style="animation-duration: 0.5s"></div>
                        <div class="w-1.5 bg-blue-500 rounded-full h-4 animate-pulse" style="animation-duration: 0.7s"></div>
                        <div class="w-1.5 bg-blue-500 rounded-full h-7 animate-pulse" style="animation-duration: 0.4s"></div>
                        <div class="w-1.5 bg-blue-500 rounded-full h-5 animate-pulse" style="animation-duration: 0.6s"></div>
                    </div>

                    <!-- Volume Control -->
                    <div class="flex items-center space-x-3">
                        <button onclick="toggleMute()" class="text-gray-400 hover:text-blue-400 transition text-lg">
                            <i id="volume-icon" class="fa-solid fa-volume-high"></i>
                        </button>
                        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" 
                            oninput="changeVolume(this.value)" 
                            class="w-20 md:w-28 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer custom-slider accent-blue-500">
                    </div>
                </div>

                <!-- Footer Actions inside Player -->
                <div class="flex flex-wrap items-center justify-between text-xs text-gray-400 pt-2 border-t border-blue-900/30 gap-3">
                    <span>Słuchaj we własnym odtwarzaczu: 
                        <a href="https://s3.slotex.pl/shoutcast/7246/stream?sid=1" target="_blank" 

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 w-full py-4 text-center text-xs text-gray-500 border-t border-blue-900/20 bg-black/40">
        &copy; 2026 OnlyFM. Wszelkie prawa zastrzeżone. Nowoczesne Radio Internetowe.
    </footer>

    <!-- Simple Custom Notification Modal -->
    <div id="info-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full mx-4 text-center">
            <h3 id="modal-text" class="text-base font-semibold text-white mb-4">Komunikat</h3>
            <button onclick="closeModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded-xl text-sm transition shadow-[0_0_15px_rgba(59,130,246,0.4)]">OK</button>
        </div>
    </div>

    <script>
        // Audio stream setup
        const streamUrl = 'https://s3.slotex.pl/shoutcast/7246/stream?sid=1';
        const audioElement = new Audio(streamUrl);
        audioElement.preload = 'none';
        audioElement.volume = 0.8;

        let isPlaying = false;
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const equalizer = document.getElementById('equalizer');

        function togglePlay() {
            if (isPlaying) {
                audioElement.pause();
                audioElement.src = ''; // Clear source to stop buffering live stream when paused
                isPlaying = false;
                playIcon.className = "fa-solid fa-play ml-0.5";
                playBtn.classList.remove('bg-blue-500');
                playBtn.classList.add('bg-blue-600');
                equalizer.style.opacity = '0.4';
            } else {
                audioElement.src = streamUrl;
                audioElement.play().then(() => {
                    isPlaying = true;
                    playIcon.className = "fa-solid fa-pause";
                    playBtn.classList.remove('bg-blue-600');
                    playBtn.classList.add('bg-blue-500');
                    equalizer.style.opacity = '1';
                }).catch(err => {
                    console.error("Błąd odtwarzania streamu:", err);
                    openModal("Nie udało się uruchomić strumienia. Spróbuj ponownie.");
                });
            }
        }

        function changeVolume(val) {
            audioElement.volume = val;
            const volumeIcon = document.getElementById('volume-icon');
            if (val == 0) {
                volumeIcon.className = "fa-solid fa-volume-xmark";
            } else if (val < 0.5) {
                volumeIcon.className = "fa-solid fa-volume-low";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high";
            }
        }

        let previousVolume = 0.8;
        function toggleMute() {
            const slider = document.getElementById('volume-slider');
            if (audioElement.volume > 0) {
                previousVolume = audioElement.volume;
                slider.value = 0;
                changeVolume(0);
            } else {
                slider.value = previousVolume;
                changeVolume(previousVolume);
            }
        }

        // Fetch Metadata (Prezenter & Nuta) with secure fallback
        function updateMetadata() {
            // Przykładowy endpoint pobierania statusu z Shoutcast v1/v2 lub fallback do symulacji bezpiecznej
            // Slotex zazwyczaj udostępnia statystyki w formacie JSON lub XML, tutaj używamy bezpiecznego timera i zapytania CORS
            const presenterEl = document.getElementById('presenter-name');
            const songEl = document.getElementById('song-title');

            // Symulacja / odczyt metadanych ze strumienia (w przypadku braku bezpośredniego publicznego JSON API serwera)
            // Możesz wstawić tutaj faktyczny endpoint JSON Twojego radia jeśli Slotex go udostępnia w panelu
            presenterEl.innerText = "DJ / Prezenter OnlyFM";
            songEl.innerText = "Najlepsze Hity - Na Żywo";
        }

        // Uruchomienie odświeżania metadanych co 15 sekund
        setInterval(updateMetadata, 15000);
        updateMetadata();

        // Modal functions (No alert() used as per requirements)
        function openModal(text) {
            document.getElementById('modal-text').innerText = text;
            document.getElementById('info-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        function shareRadio() {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    openModal("Link do radia został skopiowany do schowka!");
                }).catch(() => {
                    openModal("Dziękujemy za udostępnienie OnlyFM!");
                });
            } else {
                openModal("Dziękujemy za udostępnienie OnlyFM!");
            }
        }

        // Particle Background Animation using HTML5 Canvas
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        const numberOfParticles = window.innerWidth < 768 ? 35 : 70;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 1;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;

                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(59, 130, 246, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
